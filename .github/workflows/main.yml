name: UnitTests

on:
  push:
    branches: [ master, staging*]
  pull_request:
    branches: [ master ]


jobs:
  linux-ubuntu2204:
    runs-on: ubuntu-22.04

    strategy:
      # Don't abort runners if a single one fails
      fail-fast: false

      matrix:
        compiler: ["gcc-10", "gcc-11", "gcc-12", "clang-13", "clang-14", "clang-15"]
        cex_preset: ["CEX_DEBUG", "CEX_RELEASE", "CEX_NDEBUG"]

    steps:
      - name: Checkout cex
        uses: actions/checkout@v4

      - uses: ./.github/actions/env_setup
        name: Setup env

      - name: cc setup
        run: |
          #sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          #sudo apt-get update
          sudo apt-get install ${{ matrix.compiler }}
          echo "Replacing: cc to ${{ matrix.compiler }}"
          sudo rm /usr/bin/cc
          sudo ln -s /usr/bin/${{ matrix.compiler }} /usr/bin/cc 
          echo "cc --version"
          cc --version

      - name: cex initial build
        run: |
          ulimit -c unlimited 
          ls -la
          echo "Priming cex tool"
          cc -g ./cex.c -o ./cex 
          ./cex -D${{ matrix.cex_preset }} config

      - uses: ./.github/actions/cex_test
        name: cex test suite

  linux-ubuntu2404:
    runs-on: ubuntu-latest

    strategy:
      # Don't abort runners if a single one fails
      fail-fast: false

      matrix:
        compiler: ["gcc-12", "gcc-13", "gcc-14", "clang-16", "clang-17", "clang-18"]
        cex_preset: ["CEX_DEBUG", "CEX_RELEASE", "CEX_NDEBUG"]
        include:
          - cex_preset: CEX_C23
            compiler: "clang-18"

    steps:
      - name: Checkout cex
        uses: actions/checkout@v4

      - uses: ./.github/actions/env_setup
        name: Setup env

      - name: cc setup
        run: |
          #sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          #sudo apt-get update
          sudo apt-get install ${{ matrix.compiler }}
          echo "Replacing: cc to ${{ matrix.compiler }}"
          sudo rm /usr/bin/cc
          sudo ln -s /usr/bin/${{ matrix.compiler }} /usr/bin/cc 
          echo "cc --version"
          cc --version

      - name: cex initial build
        run: |
          ulimit -c unlimited 
          ls -la
          echo "Priming cex tool"
          cc -g ./cex.c -o ./cex 
          ./cex -D${{ matrix.cex_preset }} config

      - uses: ./.github/actions/cex_test
        name: cex test suite

  linux-valgrind:
    runs-on: ubuntu-latest

    strategy:
      # Don't abort runners if a single one fails
      fail-fast: false

      matrix:
        include:
          - cex_preset: CEX_VALGRIND
            compiler: "gcc-14"
          - cex_preset: CEX_VALGRIND
            compiler: "clang-18"

    steps:
      - name: Checkout cex
        uses: actions/checkout@v4

      - uses: ./.github/actions/env_setup
        name: Setup env

      - name: cc setup
        run: |
          #sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          #sudo apt-get update
          sudo apt-get install ${{ matrix.compiler }}
          sudo apt-get install valgrind
          echo "Replacing: cc to ${{ matrix.compiler }}"
          sudo rm /usr/bin/cc
          sudo ln -s /usr/bin/${{ matrix.compiler }} /usr/bin/cc 
          echo "cc --version"
          cc --version

      - name: cex initial build
        run: |
          ulimit -c unlimited 
          ls -la
          echo "Priming cex tool"
          cc -g ./cex.c -o ./cex 
          ./cex -D${{ matrix.cex_preset }} config

      - name: cex valgrind
        run: |
          ulimit -c unlimited 
          ./cex -DCEX_VALGRIND config
          ./cex test debug all

  tests-windows:
    name: ${{ matrix.runs-on }}-${{ matrix.msys }}-${{ matrix.cex_preset }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        cex_preset: 
          - CEX_DEBUG
          - CEX_RELEASE
          - CEX_NDEBUG
        msys:
          - mingw64
          - ucrt64
          - clang64
        runs-on:
          - 'windows-2022'
          - 'windows-2025'

    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: 'Setup MSYS2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.msys}}
          update: true
          install: >-
            git
          pacboy: >-
            toolchain:p

      - name: 'Test cc version / config'
        run: |
          git config --global core.autocrlf input
          cc --version

      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: cex initial build
        run: |
          ulimit -c unlimited 
          ls -la
          echo "Priming cex tool"
          cc -g ./cex.c -o ./cex.exe 
          ./cex.exe -D${{ matrix.cex_preset }} config

      - uses: ./.github/actions/cex_test
        name: cex test suite
        with:
          shell: 'msys2 {0}'

  tests-macos:
    name: ${{ matrix.runs-on }}-${{ matrix.cex_preset }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        cex_preset: 
          - CEX_DEBUG
          - CEX_RELEASE
          - CEX_NDEBUG
        runs-on:
          - macos-latest
          - macos-15-intel
    steps:
      - name: Checkout cex
        uses: actions/checkout@v4

      - name: cc version / setup
        run: |
          echo "cc --version"
          cc --version

      - name: cex initial build
        run: |
          ulimit -c unlimited 
          ls -la
          echo "Priming cex tool"
          cc -g ./cex.c -o ./cex 
          ./cex -D${{ matrix.cex_preset }} config

      - uses: ./.github/actions/cex_test
        name: cex test suite

  tests-linux-alpine:
    name: alpine-${{ matrix.arch }}-${{ matrix.cex_preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cex_preset: 
          - CEX_DEBUG
          - CEX_RELEASE
          - CEX_NDEBUG
        arch:
          - x86_64
    steps:
      - uses: actions/checkout@v2

      - name: Setup latest Alpine Linux
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Run script inside Alpine chroot as root
        shell: alpine.sh --root {0}
        run: |
          cat /etc/alpine-release
          apk add build-base
          apk add clang
          apk add musl-dev
          apk add git
          apk add file
          apk add pkgconf
          apk add zlib-dev
          apk add compiler-rt
          echo "Replacing: cc to clang"
          rm /usr/bin/cc || true
          ln -s /usr/bin/clang /usr/bin/cc 

      - name: Environment
        shell: alpine.sh {0}
        run: |
          cc --version

      - name: cex initial build
        shell: alpine.sh {0}
        run: |
          ls -la  # as you would expect, you're in your workspace directory
          echo "Priming cex tool"
          cc -g ./cex.c -o ./cex 
          echo "Compiled cex executable"
          file ./cex
          echo "CEX config"
          ./cex -D${{ matrix.cex_preset }} config

      - uses: ./.github/actions/cex_test
        name: cex test suite
        with:
          shell: 'alpine.sh {0}'

  # Full-suite coverage on each platform, merged via lcov in `coverage-merge` and
  # published to gh-pages by `deploy-release`. Runs on master and staging; only the
  # publish is master-gated.
  coverage-full-linux:
    name: coverage-full-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cex
        uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov llvm clang gcc

      - name: Configure compiler
        run: |
          cat > cex_config.h <<EOF
          #pragma once
          #define cexy\$cc "clang"
          #define cexy\$cex_self_cc "cc"
          #define cexy\$cc_args_sanitizer "-fstack-protector-strong"
          EOF
          cat cex_config.h

      - name: Bootstrap ./cex
        run: |
          ulimit -c unlimited
          cc -g ./cex.c -o ./cex
          ./cex config

      - uses: ./.github/actions/cex_coverage
        name: cex coverage
        with:
          engine: llvm
          label: linux-full
          target: all

  coverage-full-macos:
    name: coverage-full-macos
    runs-on: macos-latest
    steps:
      - name: Checkout cex
        uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          brew install lcov llvm gcc
          # Homebrew llvm is keg-only, expose llvm-cov / llvm-profdata
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          # Homebrew gcc installs versioned binaries only, expose plain `gcc`/`gcov`
          mkdir -p "$HOME/.local/bin"
          GCC_BIN="$(ls "$(brew --prefix gcc)"/bin/gcc-[0-9]* | head -n1)"
          ln -sf "$GCC_BIN" "$HOME/.local/bin/gcc"
          ln -sf "$(dirname "$GCC_BIN")/gcov-${GCC_BIN##*-}" "$HOME/.local/bin/gcov"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure compiler
        run: |
          CC="$(brew --prefix llvm)/bin/clang"
          cat > cex_config.h <<EOF
          #pragma once
          #define cexy\$cc "$CC"
          #define cexy\$cex_self_cc "cc"
          #define cexy\$cc_args_sanitizer "-fstack-protector-strong"
          EOF
          cat cex_config.h

      - name: Bootstrap ./cex
        run: |
          ulimit -c unlimited
          cc -g ./cex.c -o ./cex
          ./cex config

      - uses: ./.github/actions/cex_coverage
        name: cex coverage
        with:
          engine: llvm
          label: macos-full
          target: all

  coverage-full-windows:
    name: coverage-full-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: >-
            git
            lcov
          pacboy: >-
            toolchain:p llvm:p

      - name: Checkout cex
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure compiler
        run: |
          cat > cex_config.h <<EOF
          #pragma once
          #define cexy\$cc "clang"
          #define cexy\$cex_self_cc "cc"
          #define cexy\$cc_args_sanitizer "-fstack-protector-strong"
          EOF
          cat cex_config.h

      - name: Bootstrap ./cex
        run: |
          ulimit -c unlimited
          cc -g ./cex.c -o ./cex.exe
          ./cex.exe config

      - uses: ./.github/actions/cex_coverage
        name: cex coverage
        with:
          engine: llvm
          label: windows-full
          target: all
          shell: 'msys2 {0}'

  # Union the per-OS tracefiles into one global report, render HTML and build the
  # shields.io badge JSON. Runs on a single platform (ubuntu).
  coverage-merge:
    name: coverage-merge
    needs: [coverage-full-linux, coverage-full-macos, coverage-full-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cex
        uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Download platform tracefiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*-full
          merge-multiple: true
          path: tracefiles

      - name: Merge tracefiles
        run: |
          lcov --ignore-errors inconsistent,mismatch,empty,unused,source,format,unsupported,corrupt \
            --include 'src/*' --include 'cexstd/*' \
            -a 'tracefiles/coverage-*-full.info' \
            -o coverage-global.info
          test -s coverage-global.info
          grep -q '^SF:' coverage-global.info

      - name: HTML report
        run: |
          genhtml --quiet --synthesize-missing \
            --ignore-errors inconsistent,mismatch,empty,unused,source,format,unsupported \
            coverage-global.info -o coverage-html

      - name: Build shields.io badge
        run: |
          PCT=$(awk -F: '/^LH:/{lh+=$2} /^LF:/{lf+=$2} END{ if (lf>0) printf "%.1f", lh/lf*100; else print "0.0" }' coverage-global.info)
          COLOR=$(awk -v p="$PCT" 'BEGIN{ if (p>=90) print "green"; else if (p>=75) print "yellowgreen"; else if (p>=60) print "yellow"; else print "red" }')
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > coverage.json
          cat coverage.json

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-global
          path: |
            coverage-global.info
            coverage-html/
            coverage.json
          if-no-files-found: error

  deploy-release:
    # Publish only from master; staging and PR runs build coverage artifacts but never deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [coverage-merge, tests-macos, tests-windows, linux-ubuntu2404]
    permissions:
      contents: write  # This allows creating releases and uploading assets
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup environment
        run: |
          echo "BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

          cc -g ./cex.c -o ./cex 
          echo "Compiled cex executable"

          wget https://github.com/quarto-dev/quarto-cli/releases/download/v1.7.34/quarto-1.7.34-linux-amd64.deb -O quarto.deb
          sudo dpkg -i quarto.deb
          sudo apt install zip

          quarto
          zip

      - name: cex initial build
        run: |
          ./cex build-docs
          cp docs/docs.html docs.html
          zip cex.zip -r cexstd cex.h docs.html README.md

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-global
          path: coverage-artifact

      - name: prepare web site
        run: |
          mkdir ./public
          cp cex.zip ./public/
          cp cex.h ./public/
          cp docs.html ./public/
          cp ./docs/index.html ./public/
          cp ./docs/install.sh ./public/
          mkdir -p ./public/coverage
          cp -r coverage-artifact/coverage-html/. ./public/coverage/
          cp coverage-artifact/coverage-global.info ./public/coverage.info
          cp coverage-artifact/coverage.json ./public/coverage.json
          echo "cex-c.org" > ./public/CNAME
          touch ./public/.nojekyll

      - name: Deploy web site 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Personal Access Token (PAT) with write permissions
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages  # default: gh-pages
          # The folder where your built static files are located
          publish_dir: ./public
          # Forcefully orphan the gh-pages branch to avoid history conflicts
          force_orphan: true


  wasm-enscripten:
    runs-on: ubuntu-latest

    strategy:
      # Don't abort runners if a single one fails
      fail-fast: false

      matrix:
        cex_preset: ["CEX_WASM_DEBUG", "CEX_WASM_RELEASE"]

    steps:
      - name: Checkout cex
        uses: actions/checkout@v4

      - uses: ./.github/actions/env_setup
        name: Setup env

      - name: cc setup
        run: |
          echo "cc --version"
          cc --version
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.16
          ./emsdk activate 4.0.16

      - name: cex initial build
        run: |
          source ./emsdk/emsdk_env.sh
          echo "EMCC / Node.js version"
          emcc --version
          node --version
          ulimit -c unlimited 
          ls -la
          echo "Priming cex tool"
          cc -g ./cex.c -o ./cex 
          ./cex -D${{ matrix.cex_preset }} config

      - name: cex wasm test suite
        run: |
          source ./emsdk/emsdk_env.sh
          ./cex test debug all

  clang-tidy:
    runs-on: ubuntu-latest

    strategy:
      # Don't abort runners if a single one fails
      fail-fast: false

      matrix:
        compiler: ["clang"]

    steps:
      - name: Checkout cex
        uses: actions/checkout@v4

      - uses: ./.github/actions/env_setup
        name: Setup env

      - name: cc setup
        run: |
          sudo apt-get install ${{ matrix.compiler }}
          sudo apt-get install clang-tidy
          echo "Replacing: cc to ${{ matrix.compiler }}"
          sudo rm /usr/bin/cc
          sudo ln -s /usr/bin/${{ matrix.compiler }} /usr/bin/cc 
          echo "cc --version"
          cc --version
          echo "clang-tidy --version"
          clang-tidy --version

      - name: cex initial build
        run: |
          ls -la  # as you would expect, you're in your workspace directory
          echo "Priming cex tool"
          cc -g ./cex.c -o ./cex 
          echo "Compiled cex executable"
          file ./cex
          echo "CEX config"
          ./cex config

      - name: clang-tidy checks
        run: |
          clang-tidy $(find ./src -name "*.c" -o -name "*.h")

      - name: clang-tidy std checks
        run: |
          clang-tidy $(find ./cexstd -name "*.c" -o -name "*.h")

      - name: clang-tidy std serdegen
        run: |
          clang-tidy tests/cexstd/json/advanced/serdegen.c
          clang-tidy tests/cexstd/json/basic/serdegen.c

  test-filc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xz-utils curl

      - name: Download latest Fil-C release
        run: |
          TAG=$(curl -sL https://api.github.com/repos/pizlonator/fil-c/releases/latest |
            python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          curl -sL "https://github.com/pizlonator/fil-c/releases/download/$TAG/filc-${TAG#v}-linux-x86_64.tar.xz" \
            -o /tmp/filc.tar.xz

      - name: Install filcc
        run: |
          sudo tar -xJf /tmp/filc.tar.xz -C /opt/
          DISTDIR=$(ls -d /opt/filc-*-linux-x86_64)
          cd "$DISTDIR" && sudo bash setup.sh
          sudo ln -sf "$DISTDIR/build/bin/filcc" /usr/local/bin/filcc
          filcc --version

      - name: Configure CEX for Fil-C
        run: |
          cat > cex_config.h << 'EOF'
          #pragma once
          #define cexy$cc "filcc"
          #define cexy$cex_self_cc "filcc"
          #define cexy$cc_args_sanitizer "-fstack-protector-strong"
          #define CEX_LOG_LVL 4
          EOF

      - name: Bootstrap ./cex with filcc
        run: filcc -g ./cex.c -o ./cex

      - name: Clean and run full test suite
        run: ./cex test clean all && ./cex test run all
