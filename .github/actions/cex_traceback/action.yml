name: CEX Traceback Experiments
description: Build and run cross-platform traceback backend experiments
inputs:
  shell:
    description: 'target shell'
    required: false
    default: 'bash'

runs:
  using: 'composite'

  steps:
    - name: Traceback experiment matrix
      shell: ${{ inputs.shell }}
      run: |
        echo ""
        echo "---------------------------------------------------------------------"
        echo "           STEP: traceback backend experiments"
        echo "---------------------------------------------------------------------"
        bash examples/traceback/run.sh

    - name: Traceback experiment results
      shell: ${{ inputs.shell }}
      run: |
        echo ""
        echo "---------------------------------------------------------------------"
        echo "           STEP: traceback experiment results"
        echo "---------------------------------------------------------------------"
        OUT=examples/traceback/build/traceback_out
        if [ ! -d "$OUT" ]; then
          echo "no output directory: $OUT"
          exit 0
        fi
        echo "===== summary ====="
        cat "$OUT/_summary.txt" 2>/dev/null || true
        echo ""
        for f in "$OUT"/*.log; do
          case "$f" in
            *.build.log) continue ;;
          esac
          echo "===== $(basename "$f") ====="
          cat "$f"
          echo ""
        done
